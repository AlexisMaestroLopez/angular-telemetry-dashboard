<div class="dashboard-container">
  <header class="header">
    <h1>ACTIA Systems - Telemetry Dashboard</h1>
    <p>Sistema de Monitoreo e Interacción de Maquinaria Industrial</p>
  </header>

  <main class="dashboard-grid">
    <!-- Le pasamos el status invocando a la Signal machineState() -->
    <app-control-panel 
      [status]="machineState().status"
      (start)="handleStart()"
      (stop)="handleStop()">
    </app-control-panel>

    <!-- Le pasamos todo el objeto invocando a la Signal machineState() -->
    <app-telemetry-display 
      [data]="machineState()">
    </app-telemetry-display>
  </main>
</div>
